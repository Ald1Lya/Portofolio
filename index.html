<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldino-Tegar-Zhahrolla</title>
       <link rel="icon" type="image/png" href="/img/Logo.webp">

    <!-- Path CSS -->
    <link rel="stylesheet" href="/src/output.css?v=20261031-2118">
    <link rel="stylesheet" href="/src/style.css?v=20261031-2118">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="overflow-x-hidden bg-[#10100d] font-sans text-[#f0e6d2]">
    <div class="background-glow" aria-hidden="true"></div>
    <div id="particles-js" aria-hidden="true"></div>

    <script src="/particles.js-master/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            particles: {
                number: {
                    value: 58,
                    density: { enable: true, value_area: 900 }
                },
                color: { value: ["#ffe08a", "#ffc107", "#fff3c4"] },
                shape: { type: "circle" },
                opacity: {
                    value: 0.45,
                    random: true,
                    anim: { enable: true, speed: 0.8, opacity_min: 0.12, sync: false }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: { enable: true, speed: 2, size_min: 0.5, sync: false }
                },
                line_linked: {
                    enable: true,
                    distance: 145,
                    color: "#ffc107",
                    opacity: 0.18,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.2,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                    attract: { enable: false, rotateX: 600, rotateY: 1200 }
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: false, mode: "repulse" },
                    onclick: { enable: false, mode: "push" },
                    resize: true
                }
            },
            retina_detect: true
        });
    </script>

    <!-- Navbar Melayang di Tengah (Transparan 50% & Font Mencolok) -->
    <nav class="fixed top-6 left-0 right-0 z-50 mx-auto flex w-max max-w-[calc(100vw-2rem)] items-center gap-1 rounded-full border border-[#F0E6D2]/[.12] bg-[#151515]/[.58] p-1.5 shadow-[0_12px_40px_rgb(0_0_0_/_28%),0_0_42px_rgb(255_209_102_/_8%)] ring-1 ring-white/[.03] backdrop-blur-xl transition-[box-shadow] duration-700 ease-out hover:shadow-[0_14px_48px_rgb(0_0_0_/_30%),0_0_56px_rgb(255_209_102_/_12%)] sm:gap-1.5">
        <a href="#" onclick="event.preventDefault(); loadPage('beranda.html')" class="rounded-full px-4 py-2 font-display text-lg tracking-[.12em] text-[#F0E6D2]/[.82] transition-[color,text-shadow] duration-700 ease-out hover:text-[#fff1c8] hover:[text-shadow:0_0_18px_rgb(255_209_102_/_45%)] sm:px-5 sm:text-xl md:px-6 md:text-2xl">BERANDA</a>
        <a href="#" onclick="event.preventDefault(); loadPage('about.html')" class="rounded-full px-4 py-2 font-display text-lg tracking-[.12em] text-[#F0E6D2]/[.82] transition-[color,text-shadow] duration-700 ease-out hover:text-[#fff1c8] hover:[text-shadow:0_0_18px_rgb(255_209_102_/_45%)] sm:px-5 sm:text-xl md:px-6 md:text-2xl">ABOUT</a>
        <a href="#" onclick="event.preventDefault(); loadPage('contact.html')" class="rounded-full px-4 py-2 font-display text-lg tracking-[.12em] text-[#F0E6D2]/[.82] transition-[color,text-shadow] duration-700 ease-out hover:text-[#fff1c8] hover:[text-shadow:0_0_18px_rgb(255_209_102_/_45%)] sm:px-5 sm:text-xl md:px-6 md:text-2xl">CONTACT</a>
    </nav>

    <!-- Area Konten Dinamis dengan Animasi Dasar -->
    <main id="app" class="page-transition relative z-10 w-full min-h-screen"></main>

    <script>
        let pageRevealObserver = null;
        let pageLoadId = 0;

        async function loadPage(pageUrl) {
            const app = document.getElementById('app');
            const currentLoadId = ++pageLoadId;

            app.classList.add('is-loading');

            await new Promise((resolve) => window.setTimeout(resolve, 250));
            if (currentLoadId !== pageLoadId) return;

            try {
                const pageUrlWithCacheBust = new URL(pageUrl, new URL('/Index/', window.location.origin));
                pageUrlWithCacheBust.searchParams.set('_refresh', Date.now().toString());
                const response = await fetch(pageUrlWithCacheBust, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Gagal memuat halaman: ${pageUrl} (${response.status})`);

                const html = await response.text();
                if (currentLoadId !== pageLoadId) return;

                app.innerHTML = html;
                window.scrollTo({ top: 0, behavior: 'instant' });
                app.classList.remove('is-loading');
                initPageInteractions(app);
            } catch (error) {
                if (currentLoadId !== pageLoadId) return;
                console.error(error);
                app.innerHTML = "<div class='flex h-screen items-center justify-center'><h1 class='text-2xl'>Error: Halaman tidak ditemukan</h1></div>";
                app.classList.remove('is-loading');
            }
        }

        function initPageInteractions(app) {
            if (pageRevealObserver) {
                pageRevealObserver.disconnect();
                pageRevealObserver = null;
            }

            if (document.body.dataset.cursorLightReady !== 'true') {
                document.body.dataset.cursorLightReady = 'true';
                document.body.addEventListener('pointermove', (event) => {
                    if (event.pointerType === 'touch' || !(event.target instanceof Element)) return;

                    const surface = event.target.closest('a, button, article');
                    if (!surface) return;

                    const bounds = surface.getBoundingClientRect();
                    surface.style.setProperty('--pointer-x', `${event.clientX - bounds.left}px`);
                    surface.style.setProperty('--pointer-y', `${event.clientY - bounds.top}px`);
                });
            }

            const revealItems = app.querySelectorAll(
                '.reveal, [data-reveal], .home-page > section, .home-page > div, .home-page article, main > header, main > section, main article, main > footer, .contact-card'
            );
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (reduceMotion || !('IntersectionObserver' in window)) {
                revealItems.forEach((item) => item.classList.add('is-visible'));
            } else {
                app.classList.add('page-motion-ready');
                const revealGroups = new Map();

                revealItems.forEach((item) => {
                    if (item.classList.contains('reveal')) return;
                    item.dataset.pageReveal = '';

                    const parent = item.parentElement;
                    if (!parent) return;

                    const siblings = revealGroups.get(parent) ?? [];
                    siblings.push(item);
                    revealGroups.set(parent, siblings);
                });

                revealGroups.forEach((items) => {
                    items.forEach((item, index) => {
                        item.style.setProperty('--reveal-delay', `${Math.min(index * 90, 360)}ms`);
                    });
                });

                pageRevealObserver = new IntersectionObserver((entries, currentObserver) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            currentObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12, rootMargin: '0px 0px -32px 0px' });
                revealItems.forEach((item) => pageRevealObserver.observe(item));
                revealItems.forEach((item) => pageRevealObserver.observe(item));
            }

        }

        // Muat beranda.html saat web pertama kali dibuka
        window.onload = () => {
            loadPage('beranda.html');
        };
    </script>
</body>
</html>
